challengeTitle: La Sfida
challenge: "Due frane sugli argini e l’acqua che, scendendo dalla scarpata, li faceva smottare di nuovo. Le strade a gradoni c’erano già: andava corretta la pendenza e raccolta l’acqua."
solution: "Abbiamo ricostruito e profilato gli argini franati. Ogni testa di argine, che fa da strada, è stata inclinata verso l’interno. Lungo il percorso abbiamo messo griglie che raccolgono l’acqua, la intubano e la portano a valle senza farla scorrere sulla scarpata."
