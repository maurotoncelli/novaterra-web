title: Pulizia Oliveta a Santo Pietro
id: "14"
excerpt: "Pulizia di un oliveto a Santo Pietro: trinciatura di rovi ed erba alta tra i filari, con minipala cingolata Eurocomach 20TL e trattore con trinciatrice. Il materiale resta in campo e l’oliveta torna percorribile."
