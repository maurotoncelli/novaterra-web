challengeTitle: La Sfida
challenge: "Un oliveto con erba alta, rovi e ricacci tra i filari. I passaggi sono stretti, le chiome basse e il fondo irregolare: bisogna riaprire il sottofila senza scorticare i tronchi e senza aprire piste nel terreno."
solution: "Siamo entrati con una minipala cingolata Eurocomach 20TL e trincia forestale, per triturare la vegetazione anche dove un trattore non gira. Nei filari più aperti ha lavorato il trattore Goldoni con trinciatrice, lasciando il trinciato a terra come pacciamatura. A fine intervento l’oliveta è di nuovo percorribile, senza asportare il materiale."
