serviceLabel: Bonifica vigneto
challengeTitle: La Sfida
challenge: "Rimuovere un vigneto in disuso in un contesto di filari ancora in produzione, su terreno collinare con erba alta e accessi stretti, senza danneggiare i vigneti confinanti e senza aprire piste invasive."
solution: "Abbiamo lavorato fila per fila con un escavatore cingolato Yanmar equipaggiato di pinza idraulica NPK: viti e pali vengono afferrati, sradicati e caricati sul rimorchio agricolo. Restando nei tracciati del vigneto, il mezzo riduce il calpestio e lascia il campo sgombro per la nuova destinazione del suolo."
