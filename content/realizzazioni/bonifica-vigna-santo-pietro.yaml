title: Bonifica Vigna a Santo Pietro
id: "12"
excerpt: "Disfacimento di un vigneto in collina: estirpo dei filari, rimozione pali e vegetazione, carico e sgombero del materiale. Escavatore Yanmar con pinza NPK, trattore con rimorchio per il trasporto."
year: "2026"
