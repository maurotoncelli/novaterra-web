title: Bacino Idrico a Ghizzano
id: "13"
excerpt: "Scavo e modellazione di un invaso collinare a Ghizzano, con movimento terra e posa delle reti. CASE CX210E per lo scavo del bacino, Yanmar per la finitura delle sponde, tubazioni e cisterne a servizio della proprietà."
year: "2024"
publishedAt: 2024-02-02
category: bacini
