client: Privato
location: Ghizzano (PI)
serviceLabel: Bacini idrici e scavi
challengeTitle: La Sfida
challenge: "Realizzare un bacino idrico in collina insieme agli scavi di servizio — tubazioni, cisterne, movimento terre — in un contesto agricolo e residenziale, senza compromettere accessi e fabbricati e con controllo di pendenze e acque."
solution: "Abbiamo scavato l’invaso a pianta circolare con un CASE CX210E, poi modellato e rifinito le sponde con un Yanmar. In parallelo: scavi per la rete in PVC e posa delle cisterne interrate. Le terre di risulta sono state gestite in sito per piste e rimodellamento."
