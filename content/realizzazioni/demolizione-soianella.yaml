title: Aperture nei tini a Soianella
id: "15"
excerpt: "Aperture in tini di cemento armato in una cantina a Soianella, Terricciola. Taglio con disco e martello, armatura sezionata sul perimetro, varchi netti senza compromettere volta e tini confinanti."
