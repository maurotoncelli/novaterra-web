challengeTitle: La Sfida
challenge: "Aprire varchi regolari in pareti di cemento armato, dentro una cantina a volta. Spazi stretti, polvere, armatura da sezionare e tini confinanti da non lesionare."
solution: "Abbiamo tracciato il vano sulla parete del tino, tagliato il perimetro con la troncatrice a disco e demolito il cuore con il martello. L'armatura si sega sul bordo dell'apertura. Si lavora in quota, su ponteggio, con protezione dalle polveri. A fine intervento i varchi sono netti e il corridoio tra i tini resta agibile."
