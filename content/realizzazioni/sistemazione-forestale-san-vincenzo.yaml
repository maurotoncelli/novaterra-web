serviceLabel: Sistemazioni forestali
challengeTitle: La Sfida
challenge: "Operare in un bosco mediterraneo con pendenze, accessi stretti e vegetazione densa, esboscando e accatastando il materiale senza danneggiare il soprassuolo residuo e senza aprire piste invasive."
solution: "Abbiamo lavorato con un forwarder forestale John Deere: gru e pinza per il carico, accatastamento ordinato in sito e avanzamento su terreno accidentato. Il mezzo consente di muovere volumi importanti di legna restando nei tracciati, riducendo il calpestio e lasciando il cantiere pulito."
